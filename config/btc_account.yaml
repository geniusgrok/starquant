# One BTCUSDT USDT-M account. Both sides, one-way isolated, leverage 20.
# taker, slip_base, impact_y, fx_fee, and leverage are recorded here.
# The replay reads btc_perp/costs.py. tests/test_btc_account.py fails if this
# copy drifts. take_profit_multiple is a disaster cap, not the research exit.
# Production entries stay closed until config/limits.yaml is filled and
# STARQUANT_ALLOW_PROD_ORDERS=yes.
symbol: BTCUSDT
margin_mode: isolated
position_mode: one_way
leverage: 20
start_cny: 10000
session_seconds: 300
poll_seconds: 5

# Donchian on completed hours. The first entry_hours bars are not a signal:
# a short prefix is not this window. Stops are live on every 1-minute OHLC path point.
entry_hours: 1008
exit_hours: 192
stop: 0.032
trail: 0.16
add_step: 0.05
max_units: 3
risk: 0.048
# Blocks a new entry and a pyramid add when close-to-close equity/peak is at or below 1 - dd_flat.
dd_flat: 0.47
# Closes the open position when a path mark is at or below this fraction of the path peak.
flatten_ratio: 0.5
# New entries use entry_scale once close equity/peak is below entry_scale_below. Adds do not.
entry_scale_below: 0.82
entry_scale: 0.5
iso_frac: 0.28
cooldown_hours: 6
ratchet_gain: 0.35
ratchet_trail: 0.07
heat: 0.6
# Disaster cap resting on the exchange while a position is open. The research
# exit is the trail, the channel, or the half-peak flatten. The historical
# simulator does not fill this price.
take_profit_multiple: 10.0

taker: 0.0004
slip_base: 0.0001
impact_y: 0.5
fx_fee: 0.0035
