# BTCUSDT account research.
#
# Dependencies install from requirements.lock. A range in pyproject.toml is not
# re-resolved on each run, so a checker or library cannot change version by itself.
# Format, lint, types, and tests each run when install succeeded, so one failure
# does not hide the others. A failed step still fails the job.
#
# The secrets step scans the full history. Deleting a file does not remove a key
# that was committed earlier. The gitleaks version is pinned for the same reason
# the lockfile exists.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secrets（全历史扫描）
        if: ${{ !cancelled() }}
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --no-banner

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install（按锁安装，不重新解析）
        id: install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.lock
          pip install -e . --no-deps

      - name: Environment（版本存档）
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python -VV
          python -c "import numpy, numba, yaml; print('numpy', numpy.__version__, '| numba', numba.__version__, '| pyyaml', yaml.__version__)"
          ruff --version
          mypy --version
          pytest --version

      - name: Format
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff format --check .

      - name: Lint
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: ruff check .

      - name: Types
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: mypy

      - name: Tests (offline)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: pytest -m "not network"
