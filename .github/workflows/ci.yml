# Full-history secrets scan, Python 3.12 imports, and representative offline tests.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Secrets（全历史扫描）
        if: ${{ !cancelled() }}
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -sSfL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          /tmp/gitleaks version
          /tmp/gitleaks detect --source . --config .gitleaks.toml --redact --no-banner

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install
        id: install
        run: |
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Syntax and imports
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          python -m compileall -q btc_perp tests
          python -c "import btc_perp.__main__, btc_perp.runner, btc_perp.binance_client"

      - name: Tests (offline)
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: python -m pytest -m "not network"
