[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["btc_perp"]

[project]
name = "btc-perp"
version = "0.1.0"
description = "Private BTCUSDT USDT-M account runner. The copyright holder may run a demo account and, after that record, a capped personal account. Proprietary. Third parties have no rights."
readme = "README.md"
license = {text = "Proprietary"}
requires-python = ">=3.12,<3.14"
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = ["-q", "--strict-markers", "-p", "no:cacheprovider"]
markers = [
    "network: tests that reach the public internet (deselected by default in CI)",
]
